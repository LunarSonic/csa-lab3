limit: 1000
memory_size: 1000 

memory_mapped_io:
  0x80: [5]      
  0x84: []    

reports:
  - name: "Step-by-step"
    slice: all
    filter: state
    view: |
      T A S {T:hex} {A:hex} {S:hex} R {R}
      {pc}:	{instruction}	{pc:label}
  - name: "Result"
    slice: last
    filter: state
    view: |
      numio[0x80]: {io:0x80:hex}
      numio[0x84]: {io:0x84:dec}
    assert: |
      numio[0x80]: [] >>> []
      numio[0x84]: [] >>> [0]

